<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MISSION : 칼퇴 대작전!</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <main id="startScreen">

        <div class="overlay"></div>

        <div class="startCard">

            <div class="logo">

                <div class="missionLabel">
                    🎮 LEVEL 1
                </div>

                <h1>MISSION</h1>

                <h2>칼퇴 대작전!</h2>

                <p>
                    오늘 하루,<br>
                    당신의 선택이 퇴근을 결정합니다.
                </p>

            </div>

            <div class="playerForm">

                <label for="playerName">
                    이름
                </label>

                <input
                    id="playerName"
                    type="text"
                    maxlength="10"
                    placeholder="이름을 입력하세요">

                <label>
                    성별
                </label>

                <div class="genderGroup">

                    <button
                        type="button"
                        class="genderBtn"
                        data-gender="male">

                        👨 남성

                    </button>

                    <button
                        type="button"
                        class="genderBtn"
                        data-gender="female">

                        👩 여성

                    </button>

                </div>

                <button
                    type="button"
                    id="idCardButton">

                    🪪 출근 준비 완료

                </button>

                <button
                    type="button"
                    id="startButton">

                    ▶ 게임 시작

                </button>

            </div>

        </div>

    </main>

    <!-- 출근 준비 완료 팝업 -->

    <div id="idCardModal" class="hidden">

        <div class="idCard">

            <div class="idTitle">

                🎉 출근 준비 완료

            </div>

            <div class="idName" id="cardName">

                홍길동

            </div>

            <div class="idJob">

                신입사원

            </div>

            <div class="idReady">

                오늘 하루도 힘내세요!

            </div>

            <button
                type="button"
                id="closeCardButton">

                출근하기

            </button>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
