
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MISSION : 칼퇴 대작전!</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div id="startScreen">

    <div class="overlay"></div>

    <div class="startCard">

        <div class="logo">

            <div class="missionLabel">
                MISSION SERIES
            </div>

            <h1>

                칼퇴 대작전!

            </h1>

            <p>

                오늘 하루,<br>
                당신의 선택이 퇴근을 결정합니다.

            </p>

        </div>

        <div class="playerForm">
<label>

회사명

</label>

<input
    id="companyName"
    type="text"
    maxlength="20"
    placeholder="회사명을 입력하세요">
            <label>

                이름

            </label>

            <input
                id="playerName"
                type="text"
                maxlength="10"
                placeholder="이름을 입력하세요">

            <label>

                성별

            </label>

            <div class="genderGroup">

                <button
                    class="genderBtn"
                    data-gender="male">

                    👨 남성

                </button>

                <button
                    class="genderBtn"
                    data-gender="female">

                    👩 여성

                </button>

            </div>

           <button id="idCardButton">

사원증 발급

</button>

<button id="startButton">

게임 시작

</button>

        </div>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
